// メモ帳イベントを日付→配列のマップに変換
// イベント一時ストア（クリックハンドラ用）
let calEventStore = {};

function buildEventMap() {
  const map = {};
  calEventStore = {};
  let eid = 0;

  // ノート：diaryは作成日、scheduleは予定日、その他（shopping/idea/memo）はカレンダー非表示
  (memory.notes || []).forEach(note => {
    let anchor = null;
    if (note.category === 'schedule' && note.scheduleDate) {
      anchor = new Date(note.scheduleDate);
    } else if (note.category === 'diary') {
      anchor = new Date(note.ts);
    } else {
      return; // task/shopping/idea/memo はカレンダーに出さない
    }
    const key = anchor.getFullYear() + '-' + (anchor.getMonth()+1) + '-' + anchor.getDate();
    if (!map[key]) map[key] = [];
    const id = 'ev' + (eid++);
    const ev = { id, type:'note', category: note.category||'memo', label: note.text, note };
    calEventStore[id] = ev;
    map[key].push(ev);
  });

  // タスク → dueDate優先、なければts
  (memory.tasks || []).forEach((task, tidx) => {
    const anchor = task.dueDate ? new Date(task.dueDate) : (task.ts ? new Date(task.ts) : null);
    if (!anchor) return;
    const key = anchor.getFullYear() + '-' + (anchor.getMonth()+1) + '-' + anchor.getDate();
    if (!map[key]) map[key] = [];
    const id = 'ev' + (eid++);
    const ev = { id, type:'task', category:'task', label: task.title, task, taskIdx: tidx, dueDate: task.dueDate||null };
    calEventStore[id] = ev;
    map[key].push(ev);
  });

  return map;
}

function fmtCalDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + fmt(ts);
}

function openCalDetail(evId) {
  const ev = calEventStore[evId];
  if (!ev) return;

  const CAT_COLOR = { task:'#534AB7', schedule:'#0A6EBD', diary:'#854F0B', shopping:'#0F6E56', idea:'#1A5299', memo:'#555', other:'#666' };
  const CAT_BG    = { task:'#EEEDFE', schedule:'#E8F4FE', diary:'#FEF3E2', shopping:'#E8F8F1', idea:'#E8F0FE', memo:'#F3F2F8', other:'#F3F2F8' };
  const cat = ev.category || 'memo';
  const tagEl = document.getElementById('cd-tag');
  tagEl.textContent = CAT_LABELS[cat] || cat;
  tagEl.style.background = CAT_BG[cat] || CAT_BG.other;
  tagEl.style.color = CAT_COLOR[cat] || CAT_COLOR.other;

  document.getElementById('cd-due').style.display = 'none';
  document.getElementById('cd-done').style.display = 'none';
  const actionsEl = document.getElementById('cd-actions');
  actionsEl.innerHTML = '';

  if (ev.type === 'task') {
    const task = ev.task;
    document.getElementById('cd-title').textContent = task.title;
    document.getElementById('cd-body').textContent = '';
    document.getElementById('cd-date').textContent = task.dueDate
      ? '期限: ' + fmtCalDate(task.dueDate)
      : (task.ts ? '登録: ' + fmtCalDate(task.ts) : '');
    if (task.dueDate) {
      const dueEl = document.getElementById('cd-due');
      dueEl.textContent = '📅 期限: ' + fmtCalDate(task.dueDate);
      dueEl.style.display = '';
    }
    if (task.done) document.getElementById('cd-done').style.display = '';
    document.getElementById('cd-meta').innerHTML =
      (task.urgent ? '<span style="color:#E24B4A;">⚡ 急ぎ</span>' : '') +
      '<span>登録日: ' + (task.ts ? fmtCalDate(task.ts) : '—') + '</span>';

    // 完了ボタン
    const doneBtn = document.createElement('button');
    doneBtn.className = 'cal-detail-done-btn' + (task.done ? ' already' : '');
    doneBtn.textContent = task.done ? '完了済み' : '完了にする';
    if (!task.done) {
      doneBtn.onclick = () => {
        const idx = memory.tasks.findIndex(t => t === task || t.title === task.title);
        if (idx >= 0) { memory.tasks[idx].done = true; saveMemLocal(); renderTasks(); if (accessToken) saveToDrive(); renderCalendar(); }
        closeCalDetail();
      };
    }
    actionsEl.appendChild(doneBtn);

    // チャットへ飛ぶボタン
    const chatBtn = document.createElement('button');
    chatBtn.className = 'cal-detail-goto-btn';
    chatBtn.textContent = 'チャットで相談';
    chatBtn.onclick = () => { closeCalDetail(); switchTab('chat'); document.getElementById('user-input').value = `「${task.title}」について相談したい`; };
    actionsEl.appendChild(chatBtn);

  } else {
    // note
    const note = ev.note;
    document.getElementById('cd-title').textContent = CAT_LABELS[cat] || 'メモ';
    document.getElementById('cd-body').textContent = note.text || '';
    document.getElementById('cd-date').textContent = fmtCalDate(note.ts);
    document.getElementById('cd-meta').innerHTML = '作成: ' + fmtCalDate(note.ts);

    // メモ帳へ飛ぶボタン
    const gotoBtn = document.createElement('button');
    gotoBtn.className = 'cal-detail-goto-btn';
    gotoBtn.textContent = 'メモ帳で開く';
    gotoBtn.onclick = () => { closeCalDetail(); switchTab('notepad'); setNoteFilter(cat); };
    actionsEl.appendChild(gotoBtn);
  }

  document.getElementById('cal-detail-modal').classList.add('open');
}

function closeCalDetail() {
  document.getElementById('cal-detail-modal').classList.remove('open');
}

function renderCalMonth(body) {
  const y = calAnchor.getFullYear(), m = calAnchor.getMonth();
  document.getElementById('cal-title').textContent = y + '年' + (m+1) + '月';
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m+1, 0);
  const startDow = firstDay.getDay();
  const eventMap = buildEventMap();
  const DAYS = ['日','月','火','水','木','金','土'];

  const grid = document.createElement('div');
  grid.className = 'cal-month-grid';

  const wrow = document.createElement('div');
  wrow.className = 'cal-weekday-row';
  DAYS.forEach(d => { const c = document.createElement('div'); c.className='cal-weekday-cell'; c.textContent=d; wrow.appendChild(c); });
  grid.appendChild(wrow);

  const dgrid = document.createElement('div');
  dgrid.className = 'cal-days-grid';

  // 前月空白
  for (let i = 0; i < startDow; i++) {
    const d = new Date(y, m, -startDow + i + 1);
    const cell = document.createElement('div'); cell.className='cal-day other-month';
    cell.innerHTML = `<div class="cal-day-num">${d.getDate()}</div>`; dgrid.appendChild(cell);
  }
  for (let day = 1; day <= lastDay.getDate(); day++) {
    const date = new Date(y, m, day); date.setHours(0,0,0,0);
    const isToday = date.getTime() === today.getTime();
    const key = y + '-' + (m+1) + '-' + day;
    const events = eventMap[key] || [];
    const holiday = getHoliday(y, m+1, day);
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (isToday ? ' today' : '') + (holiday ? ' holiday' : '');
    const numDiv = document.createElement('div'); numDiv.className='cal-day-num'; numDiv.textContent=day;
    cell.appendChild(numDiv);
    if (holiday) {
      const hl = document.createElement('div'); hl.className='cal-holiday-label'; hl.textContent=holiday;
      cell.appendChild(hl);
    }
    events.slice(0,3).forEach(ev => {
      const evEl = document.createElement('div');
      evEl.className = `cal-event cat-${ev.category}`;
      evEl.textContent = ev.label.slice(0, ev.type==='task' ? 12 : 14) + (ev.type==='task' && ev.dueDate ? ' 📅' : '');
      evEl.onclick = (e) => { e.stopPropagation(); openCalDetail(ev.id); };
      cell.appendChild(evEl);
    });
    if (events.length > 3) {
      const more = document.createElement('div'); more.className='cal-event cat-memo';
      more.textContent = '+' + (events.length-3) + '件';
      more.onclick = (e) => { e.stopPropagation(); openCalDayList(y, m, day, events); };
      cell.appendChild(more);
    }
    dgrid.appendChild(cell);
  }
  // 後月空白
  const trailing = 42 - (startDow + lastDay.getDate());
  for (let i = 1; i <= trailing; i++) {
    const cell = document.createElement('div'); cell.className='cal-day other-month';
    cell.innerHTML = `<div class="cal-day-num">${i}</div>`; dgrid.appendChild(cell);
  }
  grid.appendChild(dgrid);
  body.innerHTML = ''; body.appendChild(grid);
}

function openCalDayList(y, m, day, events) {
  // 3件超の日をクリックした時に全件詳細モーダルで選択できるようにする
  // 簡易実装: 最初の詳細を表示（将来的にリスト化可能）
  if (events[0]) openCalDetail(events[0].id);
}

function renderCalYear(body) {
  const y = calAnchor.getFullYear();
  document.getElementById('cal-title').textContent = y + '年';
  const today = new Date();
  const eventMap = buildEventMap();
  const wrap = document.createElement('div'); wrap.className='cal-year-grid';
  for (let m = 0; m < 12; m++) {
    const firstDay = new Date(y, m, 1);
    const lastDay = new Date(y, m+1, 0);
    const startDow = firstDay.getDay();
    const mbox = document.createElement('div'); mbox.className='cal-mini-month';
    mbox.onclick = () => calYearMonthClick(y, m);
    const mtitle = document.createElement('div'); mtitle.className='cal-mini-month-title'; mtitle.textContent=(m+1)+'月'; mbox.appendChild(mtitle);
    const mgrid = document.createElement('div'); mgrid.className='cal-mini-grid';
    for (let i = 0; i < startDow; i++) { const c=document.createElement('div'); c.className='cal-mini-cell other'; mgrid.appendChild(c); }
    for (let d = 1; d <= lastDay.getDate(); d++) {
      const key = y + '-' + (m+1) + '-' + d;
      const hasEv = !!(eventMap[key] && eventMap[key].length);
      const isTd = (y===today.getFullYear() && m===today.getMonth() && d===today.getDate());
      const hasHol = !!getHoliday(y, m+1, d);
      const c = document.createElement('div');
      c.className = 'cal-mini-cell' + (hasEv?' has-event':'') + (isTd?' today':'') + (hasHol?' holiday':'');
      c.textContent = d;
      if (hasEv) { const evs=eventMap[key]; c.onclick=(e)=>{e.stopPropagation();openCalDetail(evs[0].id);}; c.style.cursor='pointer'; }
      mgrid.appendChild(c);
    }
    mbox.appendChild(mgrid); wrap.appendChild(mbox);
  }
  body.innerHTML = ''; body.appendChild(wrap);
}

function renderCalWeek(body) {
  const anchor = new Date(calAnchor); anchor.setHours(0,0,0,0);
  const dow = anchor.getDay();
  const weekStart = new Date(anchor.getTime() - dow * 86400000);
  const weekDays = Array.from({length:7}, (_,i) => new Date(weekStart.getTime() + i * 86400000));
  const today = new Date(); today.setHours(0,0,0,0);
  const DAYS = ['日','月','火','水','木','金','土'];
  const s = weekStart, e = weekDays[6];
  document.getElementById('cal-title').textContent = s.getFullYear()+'年 '+(s.getMonth()+1)+'/'+s.getDate()+'〜'+(e.getMonth()+1)+'/'+e.getDate();

  const wrap = document.createElement('div'); wrap.className='cal-week-grid';

  // ヘッダー行
  const header = document.createElement('div'); header.className='cal-week-header';
  const emptyH = document.createElement('div'); emptyH.className='cal-week-header-cell'; header.appendChild(emptyH);
  weekDays.forEach((d,i) => {
    const isT = d.getTime()===today.getTime();
    const hol = getHoliday(d.getFullYear(), d.getMonth()+1, d.getDate());
    const c = document.createElement('div'); c.className='cal-week-header-cell'+(isT?' today-col':'')+(hol?' holiday':'');
    c.innerHTML = DAYS[i]+'<br><span style="font-size:11px;font-weight:'+(isT?700:400)+'">'+d.getDate()+'</span>'+(hol?`<br><span class="cal-week-holiday-label">${hol}</span>`:'');
    header.appendChild(c);
  });
  wrap.appendChild(header);

  const weekBodyEl = document.createElement('div'); weekBodyEl.className='cal-week-body';
  const inner = document.createElement('div'); inner.className='cal-week-inner';
  const eventMap = buildEventMap();

  for (let h = 0; h < 24; h++) {
    const tlabel = document.createElement('div'); tlabel.className='cal-time-label'; tlabel.textContent=h+':00'; inner.appendChild(tlabel);
    weekDays.forEach(d => {
      const isT = d.getTime()===today.getTime();
      const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      const eventsAtH = (eventMap[key]||[]).filter(ev => new Date(ev.note?.ts||ev.task?.ts||0).getHours()===h);
      const slot = document.createElement('div'); slot.className='cal-week-slot'+(isT?' today-col':'');
      eventsAtH.forEach(ev => {
        const evEl = document.createElement('div'); evEl.className='cal-week-event cat-'+(ev.category||'memo');
        evEl.textContent = ev.label.slice(0,12) + (ev.type==='task'&&ev.dueDate?' 📅':'');
        evEl.onclick = () => openCalDetail(ev.id);
        slot.appendChild(evEl);
      });
      inner.appendChild(slot);
    });
  }
  weekBodyEl.appendChild(inner); wrap.appendChild(weekBodyEl);
  body.innerHTML = ''; body.appendChild(wrap);
  weekBodyEl.scrollTop = Math.max(0,(new Date().getHours()-1)*42);
}

function calDayClick(y, m, d) { /* reserved */ }

function calYearMonthClick(y, m) {
  calAnchor = new Date(y, m, 1);
  setCalView('month');
}

async function sendMsg() {
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  document.getElementById('quick-btns').style.display='none';
  document.getElementById('send-btn').disabled = true;
  const ts = Date.now();
  appendUserMsg(text, ts);
  history.push({ role:'user', content:text });
  displayLog.push({ role:'user', text, ts });
  showTyping();
  try {
    const sendHistory = history.slice(-MAX_SEND * 2);
    const callAPI = async () => {
      const r = await fetch(WORKER_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1200, system:buildSystemPrompt(), messages:sendHistory })
      });
      return await r.json();
    };

    let data = await callAPI();
    if (data.type === 'error' && data.error?.type === 'overloaded_error') {
      showToast('混み合っています。5秒後に再試行します...');
      await new Promise(r => setTimeout(r, 5000));
      data = await callAPI();
    }
    if (data.type === 'error' && data.error?.type === 'overloaded_error') {
      removeTyping();
      setMood('sorry');
      appendAriaMsg('ただいま混み合っています。少し待ってから話しかけてください。', Date.now());
      document.getElementById('send-btn').disabled = false;
      return;
    }
    const raw = data.content?.[0]?.text || 'すみません、うまく返答できませんでした。';
    // ARIA_METAをまず除去してからメタ解析（表示には絶対出さない）
    const metaMatch = raw.match(/ARIA_META:(\{[\s\S]*)/);
    const metaJson = metaMatch ? metaMatch[1].match(/\{[\s\S]*/) ?
      (() => { try { return JSON.parse(metaMatch[1].match(/(\{[\s\S]*\})/)?.[1] || '{}'); } catch(e){ return null; } })() : null : null;
    const clean = raw.replace(/\n?ARIA_META:[\s\S]*/g, '').trim();
    let mood = 'normal';
    if (metaJson) {
      try {
        const meta = metaJson;
        mood = meta.mood || 'normal';
        if (meta.remove_tasks && meta.remove_tasks.length) {
          const norm = s => s.replace(/[\s\u3000。、・]/g, '').toLowerCase();
          meta.remove_tasks.forEach(title => {
            const nDel = norm(title);
            const idx = memory.tasks.findIndex(t =>
              t.title === title ||
              norm(t.title) === nDel ||
              norm(t.title).includes(nDel) ||
              nDel.includes(norm(t.title))
            );
            if (idx >= 0) memory.tasks.splice(idx, 1);
          });
        }
        if (meta.tasks && meta.tasks.length) {
          const norm = s => s.replace(/[\s　。、・]/g, '').toLowerCase();
          meta.tasks.forEach(newTask => {
            const nNew = norm(newTask.title);
            const idx = memory.tasks.findIndex(t =>
              t.title === newTask.title ||
              norm(t.title) === nNew ||
              norm(t.title).includes(nNew) ||
              nNew.includes(norm(t.title))
            );
            if (idx >= 0) { memory.tasks[idx] = { ...memory.tasks[idx], ...newTask }; }
            else { memory.tasks.push(newTask); }
          });
        }
        if (meta.memo) {
          const norm = s => s.replace(/[\s　。、・]/g, '').toLowerCase();
          const newLines = meta.memo.split('\n').filter(line => {
            if (!line.trim()) return false;
            const nNew = norm(line);
            return !memory.memo.split('\n').some(ex => {
              const nEx = norm(ex);
              return nEx === nNew || nEx.includes(nNew) || nNew.includes(nEx);
            });
          });
          if (newLines.length) memory.memo = (memory.memo ? memory.memo + '\n' : '') + newLines.join('\n');
        }
        if (meta.aria_self) {
          const norm = s => s.replace(/[\s　。、・]/g, '').toLowerCase();
          const newLines = meta.aria_self.split('\n').filter(line => {
            if (!line.trim()) return false;
            const nNew = norm(line);
            return !memory.aria_self.split('\n').some(ex => {
              const nEx = norm(ex);
              return nEx === nNew || nEx.includes(nNew) || nNew.includes(nEx);
            });
          });
          if (newLines.length) memory.aria_self = (memory.aria_self ? memory.aria_self + '\n' : '') + newLines.join('\n');
        }
        renderTasks(); renderMemo(); saveMemLocal();
        // メモ帳への自動追加
        if (meta.note_add && meta.note_add.length) {
          if (!memory.notes) memory.notes = [];
          const addedNotes = [];
          meta.note_add.forEach(item => {
            if (!item.text || !item.text.trim()) return;
            const tempNote = { id: (Date.now() + Math.random()).toString().replace('.',''), text: item.text.trim(), category: 'memo', ts: Date.now(), classified: false };
            memory.notes.push(tempNote);
            addedNotes.push(tempNote);
          });
          saveMemLocal(); renderNotepad();
          // 非同期でAI分類
          addedNotes.forEach(async (note) => {
            try {
              const cat = await classifyNote(note.text);
              const idx = memory.notes.findIndex(n => n.id === note.id);
              if (idx >= 0) { memory.notes[idx].category = cat; memory.notes[idx].classified = true; }
              saveMemLocal(); renderNotepad();
              if (accessToken) saveToDrive();
            } catch(e) {}
          });
          if (addedNotes.length) showToast('メモ帳に ' + addedNotes.length + ' 件追加しました');
        }
      } catch(e) {}
    }
    history.push({ role:'assistant', content:clean });
    const replyTs = Date.now();
    displayLog.push({ role:'aria', text:clean, ts:replyTs });
    saveLocal(); updateCount();
    removeTyping(); setMood(mood);
    appendAriaMsg(clean, replyTs);
    saveToDrive();
  } catch(e) {
    removeTyping();
    appendAriaMsg('通信エラーが発生しました。しばらくしてからお試しください。', Date.now());
  }
  document.getElementById('send-btn').disabled = false;
}

function quickSend(text) { document.getElementById('user-input').value=text; sendMsg(); }

document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

loadLocal(); loadMemLocal(); renderAll(); renderTasks(); renderMemo(); renderNotepad(); updateCount();
showOverlay();

if (isMobile()) document.getElementById('menu-btn').style.display = 'none';

window.addEventListener('load', async () => {
  try {
    const res = await fetch('config/prompt.txt');
    SYSTEM_BASE = await res.text();
  } catch(e) { console.error('prompt.txt読み込み失敗', e); }
  const auth = loadAuth();
  if (auth) {
    accessToken = auth.token;
    setLoggedIn(auth.email);
    setStatus('orange', 'Driveから確認中...');
    await loadFromDrive();
    await loadMemFromDrive();
  }
});
